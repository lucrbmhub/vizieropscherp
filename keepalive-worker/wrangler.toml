name = "vizieropscherp-keepalive"
main = "src/index.js"
compatibility_date = "2026-08-17"
workers_dev = true

# Cron Trigger: elke dag om 06:17 UTC.
# Off-the-hour minuut en dagelijks = ruime marge op de 7-daagse pauzegrens.
[triggers]
crons = ["17 6 * * *"]

# Publieke waarden. De anon/publishable sleutel staat sowieso al in de
