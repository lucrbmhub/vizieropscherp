# door Row Level Security. Wijst naar het PRODUCTIE-Supabaseproject.
#
# Overstappen naar de Lovable-Supabase? Vervang dan beide waarden hieronder
# door die van dat project (URL + anon key) en deploy opnieuw.
[vars]
